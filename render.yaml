# Render Blueprint — Static Site for the Vite React app
# Dashboard: New → Blueprint → connect this GitHub repo
# Or: New → Static Site → Root Directory: web

services:
  - type: web
    name: ckp-voterlist-enrich
    runtime: static
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
