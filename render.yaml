# Render Blueprint: Web Service + Postgres
# New → Blueprint → connect GitHub repo udaythammichetti/ckp-voterlist-enrich

databases:
  - name: ckp-voterlist-db
    plan: free

services:
  - type: web
    name: ckp-voterlist-enrich
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Internal connection string (same region). Do not paste External URL.
      - key: DATABASE_URL
        fromDatabase:
          name: ckp-voterlist-db
          property: connectionString
